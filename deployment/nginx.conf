# One worker keeps memory bounded even on nodes reporting many host CPUs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # All writable runtime paths must work with the pod's unprivileged UID.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Set CORS here, not in the ingress: duplicate Allow-Origin headers are invalid.
        # Wildcards require callers to omit cross-origin cookies/session credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*, Authorization" always;
        add_header Access-Control-Max-Age "86400" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Revalidate the entry point after a new deployment so its hashed assets match.
        location = /index.html {
            expires -1;
        }

        location / {
            # Missing WASM/JS must return 404, rather than an HTML SPA fallback.
            try_files $uri $uri/ =404;
        }
    }
}
